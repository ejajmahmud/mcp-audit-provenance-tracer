[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit-provenance-tracer"
version = "0.1.0"
description = "Cryptographic hash-chained audit log recorder capturing full MCP tool call inputs, outputs, and side effects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-audit-provenance-tracer = "mcp_audit_provenance_tracer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_audit_provenance_tracer*"]
